[project]
name = "fp-atomics-census"
version = "0.1.0"
description = "Census of floating-point atomic operations in LLM inference engine GPU kernels"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.0",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scan"]
