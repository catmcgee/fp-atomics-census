[project]
name = "shape-hook"
version = "0.1.0"
description = "vLLM general plugin that logs the batch shape vector and per-request hidden-state hashes per forward pass"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
shape_hook = "shape_hook:register"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
